name: cloudflare-production

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/cloudflare-production
    paths:
      - ".production-trigger"
      - ".github/workflows/cloudflare-production.yml"
      - "app/**"
      - "components/**"
      - "content/**"
      - "tests/**"
      - "playwright.config.ts"
      - "package.json"
      - "vite.config.ts"
      - "wrangler.jsonc"

concurrency:
  group: yzt-digital-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Next production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Mobile smoke
        run: npm run test:mobile

      - name: Vinext compatibility
        run: npm run cloudflare:check

      - name: Vinext build
        run: npm run build:vinext

      - name: Configure production custom domain
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "wrangler.jsonc";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.name = "yzt-digital";
          config.workers_dev = false;
          config.routes = [
            {
              pattern: "yzt.digital",
              custom_domain: true
            }
          ];
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          NODE

      - name: Deploy production
        run: npm run cloudflare:deploy

      - name: Verify apex domain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            BODY=$(curl -fsSL --max-time 20 https://yzt.digital || true)
            if echo "$BODY" | grep -q "YZT.DIGITAL"; then
              echo "yzt.digital is live."
              exit 0
            fi
            echo "Waiting for custom domain propagation ($attempt/6)..."
            sleep 10
          done
          echo "Production domain did not become healthy."
          exit 1
