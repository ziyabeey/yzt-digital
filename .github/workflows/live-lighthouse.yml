name: live-lighthouse

on:
  workflow_dispatch:
  push:
    branches:
      - verify/lighthouse
    paths:
      - ".lighthouse-trigger"
      - ".github/workflows/live-lighthouse.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lighthouse mobile audit
        run: |
          npx --yes lighthouse@13.5.0 https://yzt.digital             --chrome-flags="--headless --no-sandbox"             --output=json             --output-path=lighthouse.json             --only-categories=performance,accessibility,best-practices,seo             --quiet

      - name: Report scores
        run: |
          node <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("lighthouse.json", "utf8"));
          const c = report.categories;
          const a = report.audits;
          const pct = (score) => Math.round((score ?? 0) * 100);
          console.log("LIGHTHOUSE");
          console.log("performance=" + pct(c.performance.score));
          console.log("accessibility=" + pct(c.accessibility.score));
          console.log("best_practices=" + pct(c["best-practices"].score));
          console.log("seo=" + pct(c.seo.score));
          console.log("fcp=" + a["first-contentful-paint"].displayValue);
          console.log("lcp=" + a["largest-contentful-paint"].displayValue);
          console.log("tbt=" + a["total-blocking-time"].displayValue);
          console.log("cls=" + a["cumulative-layout-shift"].displayValue);
          console.log("speed_index=" + a["speed-index"].displayValue);

          const opportunities = Object.values(a)
            .filter((audit) =>
              audit &&
              typeof audit === "object" &&
              audit.score !== null &&
              audit.score < 0.9 &&
              (audit.details?.overallSavingsMs > 0 ||
                audit.numericValue > 0)
            )
            .map((audit) => ({
              id: audit.id,
              title: audit.title,
              score: audit.score,
              displayValue: audit.displayValue ?? "",
              savingsMs: audit.details?.overallSavingsMs ?? 0,
              numericValue: audit.numericValue ?? 0,
            }))
            .sort((x, y) =>
              (y.savingsMs - x.savingsMs) ||
              (y.numericValue - x.numericValue)
            )
            .slice(0, 12);

          console.log("TOP_AUDITS");
          for (const audit of opportunities) {
            console.log(
              [
                audit.id,
                "score=" + audit.score,
                "savings_ms=" + Math.round(audit.savingsMs),
                audit.displayValue,
              ].join(" | ")
            );
          }

          const a11yFailures = Object.values(a)
            .filter((audit) =>
              audit &&
              typeof audit === "object" &&
              audit.score !== null &&
              audit.score < 1 &&
              audit.scoreDisplayMode === "binary"
            )
            .filter((audit) =>
              Object.values(c.accessibility.auditRefs)
                .some((ref) => ref.id === audit.id)
            )
            .map((audit) => audit.id);

          console.log("A11Y_FAILURES=" + a11yFailures.join(","));
          NODE

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-production
          path: lighthouse.json
          retention-days: 7
