name: cloudflare-dns-check

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/cloudflare-dns-check
    paths:
      - ".dns-check-trigger"
      - ".github/workflows/cloudflare-dns-check.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Public DNS snapshot
        shell: bash
        run: |
          set -euo pipefail
          echo "NS:"
          dig +short yzt.digital NS || true
          echo "SOA:"
          dig +short yzt.digital SOA || true
          echo "A:"
          dig +short yzt.digital A || true
          echo "AAAA:"
          dig +short yzt.digital AAAA || true
          echo "CNAME:"
          dig +short yzt.digital CNAME || true
          echo "WWW_CNAME:"
          dig +short www.yzt.digital CNAME || true
          echo "WWW_A:"
          dig +short www.yzt.digital A || true
          echo "AUTHORITATIVE_A:"
          dig +short @liz.ns.cloudflare.com yzt.digital A || true
          echo "AUTHORITATIVE_CNAME:"
          dig +short @liz.ns.cloudflare.com yzt.digital CNAME || true
          echo "AUTHORITATIVE_WWW_A:"
          dig +short @liz.ns.cloudflare.com www.yzt.digital A || true
          echo "AUTHORITATIVE_WWW_CNAME:"
          dig +short @liz.ns.cloudflare.com www.yzt.digital CNAME || true
