name: cloudflare-preview

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/cloudflare-preview
    paths:
      - ".github/workflows/cloudflare-preview.yml"
      - "app/**"
      - "components/**"
      - "content/**"
      - "package.json"
      - "vite.config.ts"
      - "wrangler.jsonc"

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Vinext compatibility
        run: npm run cloudflare:check

      - name: Vinext build
        run: npm run build:vinext

      - name: Deploy preview
        run: npm run cloudflare:preview
